<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="logoRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6433"/>
      <stop offset="100%" stop-color="#d83d16"/>
    </linearGradient>
    <radialGradient id="logoBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1a12"/>
      <stop offset="100%" stop-color="#140c08"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ff6433" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Ring with Accent Border -->
  <circle cx="100" cy="100" r="94" fill="url(#logoBg)" stroke="url(#logoRing)" stroke-width="6" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#ff6433" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Bottle Icon in Center -->
  <g transform="translate(78, 38)">
    <!-- Cap -->
    <rect x="18" y="10" width="8" height="6" rx="2" fill="#ff6433"/>
    <!-- Bottle Shape -->
    <path d="M19,16 L25,16 L25,38 L34,58 C36,63 37,70 37,78 L37,112 C37,118 32,122 22,122 C12,122 7,118 7,112 L7,78 C7,70 8,63 10,58 L19,38 Z" fill="#ff6433"/>
    <!-- Liquid Highlight -->
    <path d="M11,62 L15,42 L19,42 L14,62 C11,70 11,108 11,112 C11,115 13,117 18,118 L18,62 Z" fill="#fff" opacity="0.35"/>
    <!-- Bubbles -->
    <circle cx="22" cy="75" r="2.5" fill="#fff" opacity="0.8"/>
    <circle cx="28" cy="90" r="2" fill="#fff" opacity="0.7"/>
    <circle cx="16" cy="100" r="2.5" fill="#fff" opacity="0.9"/>
  </g>

  <!-- Text CRAFT SODA Curved or Arched -->
  <path id="curveTop" d="M 35,100 A 65,65 0 0,1 165,100" fill="none"/>
  <text font-family="'Outfit', sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="3">
    <textPath href="#curveTop" startOffset="50%" text-anchor="middle">CRAFT SODA</textPath>
  </text>

  <!-- Bottom Arch ESTD 2018 -->
  <path id="curveBottom" d="M 160,105 A 65,65 0 0,1 40,105" fill="none"/>
  <text font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#ff6433" letter-spacing="2">
    <textPath href="#curveBottom" startOffset="50%" text-anchor="middle">★ ESTD 2018 ★</textPath>
  </text>
</svg>
