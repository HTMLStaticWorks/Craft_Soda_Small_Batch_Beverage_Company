<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="pulseBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6433" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#16100d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="40%" stop-color="#ff6433"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" rx="40" fill="url(#pulseBg)"/>
  <!-- Pulse Rings -->
  <circle cx="400" cy="400" r="280" fill="none" stroke="#ff6433" stroke-width="2" opacity="0.3"/>
  <circle cx="400" cy="400" r="200" fill="none" stroke="#ff6433" stroke-width="3" stroke-dasharray="8,6" opacity="0.5"/>
  <circle cx="400" cy="400" r="120" fill="none" stroke="#ffedd5" stroke-width="2" opacity="0.4"/>

  <!-- Glowing Bottle -->
  <g transform="translate(250, 80)">
    <rect x="125" y="40" width="50" height="30" rx="6" fill="#fdba74"/>
    <path d="M130,70 L170,70 L170,200 L210,300 C220,330 225,365 225,400 L225,600 C225,630 195,650 150,650 C105,650 75,630 75,600 L75,400 C75,365 80,330 90,300 L130,200 Z" fill="url(#neonOrange)"/>
    <text x="150" y="440" font-family="'Outfit', sans-serif" font-size="24" font-weight="900" fill="#fff" text-anchor="middle" letter-spacing="4">REAL FIZZ</text>
    <text x="150" y="470" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#16100d" text-anchor="middle">MICRO-BATCH LAB</text>
  </g>
</svg>