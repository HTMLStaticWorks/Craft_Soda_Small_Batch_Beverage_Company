<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="kettleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0502" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="copperKettle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="30%" stop-color="#fdba74"/>
      <stop offset="60%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="30" fill="url(#kettleGlow)"/>
  
  <!-- Copper Kettle -->
  <g transform="translate(200, 160)">
    <ellipse cx="200" cy="70" rx="170" ry="30" fill="#7c2d12"/>
    <path d="M30,70 Q20,260 200,290 Q380,260 370,70 Z" fill="url(#copperKettle)"/>
    <ellipse cx="200" cy="70" rx="150" ry="20" fill="#431407"/>
    <!-- Steam Lines -->
    <path d="M140,40 Q130,0 160,-30" stroke="#fff" stroke-width="4" fill="none" opacity="0.4" stroke-linecap="round"/>
    <path d="M200,30 Q220,-10 190,-40" stroke="#fff" stroke-width="5" fill="none" opacity="0.6" stroke-linecap="round"/>
    <path d="M260,40 Q280,5 250,-25" stroke="#fff" stroke-width="4" fill="none" opacity="0.4" stroke-linecap="round"/>
  </g>
  <text x="400" y="80" font-family="'Outfit', sans-serif" font-size="28" font-weight="900" fill="#fff" text-anchor="middle">COPPER KETTLE BREWING</text>
  <text x="400" y="115" font-family="'Inter', sans-serif" font-size="14" fill="#fdba74" text-anchor="middle" letter-spacing="3">SLOW-SIMMERED BOTANICAL INFUSIONS</text>
</svg>