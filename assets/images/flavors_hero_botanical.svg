<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6433" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#251a14" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0e0a08" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#f59e0b" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#f59e0b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background card container -->
  <rect width="800" height="800" rx="40" fill="url(#bgGlow)"/>

  <!-- Fizz particle bubbles -->
  <circle cx="350" cy="450" r="6" fill="#fff" opacity="0.6"/>
  <circle cx="430" cy="380" r="4" fill="#fff" opacity="0.8"/>
  <circle cx="380" cy="300" r="8" fill="#fff" opacity="0.5"/>
  <circle cx="420" cy="520" r="5" fill="#fff" opacity="0.7"/>
  <circle cx="370" cy="600" r="7" fill="#fff" opacity="0.4"/>
  <circle cx="440" cy="640" r="5" fill="#fff" opacity="0.6"/>
  <circle cx="360" cy="220" r="4" fill="#fff" opacity="0.5"/>
  <circle cx="435" cy="250" r="3" fill="#fff" opacity="0.8"/>

  <!-- Bottle Silhouette & Liquid -->
  <g filter="url(#shadow)">
    <!-- Neck & Cap -->
    <rect x="375" y="80" width="50" height="25" rx="5" fill="url(#capGrad)"/>
    <path d="M380,105 L420,105 L420,220 L455,310 C465,335 470,365 470,400 L470,680 C470,710 445,730 400,730 C355,730 330,710 330,680 L330,400 C330,365 335,335 345,310 L380,220 Z" fill="url(#glassGrad)"/>
    
    <!-- Bottle glass highlight sheen -->
    <path d="M345,330 C340,360 340,680 340,680 C340,700 355,715 380,720 L380,310 Z" fill="#ffffff" opacity="0.18"/>
    <line x1="455" y1="340" x2="455" y2="670" stroke="#ffffff" stroke-width="4" opacity="0.25" stroke-linecap="round"/>

    <!-- Premium Vintage Label -->
    <g transform="translate(345, 410)">
      <rect x="0" y="0" width="110" height="170" rx="12" fill="#fff9f5" stroke="#d97706" stroke-width="2"/>
      <rect x="5" y="5" width="100" height="160" rx="8" fill="none" stroke="#ff6433" stroke-width="1" stroke-dasharray="3,2"/>
      
      <!-- Label Details -->
      <text x="55" y="30" font-family="'Outfit', sans-serif" font-size="10" font-weight="bold" fill="#ff6433" text-anchor="middle" letter-spacing="2">CRAFT SODA</text>
      <line x1="20" y1="36" x2="90" y2="36" stroke="#d97706" stroke-width="1"/>
      
      <text x="55" y="58" font-family="'Outfit', sans-serif" font-size="14" font-weight="900" fill="#16100d" text-anchor="middle">BOTANICAL</text>
      <text x="55" y="75" font-family="'Outfit', sans-serif" font-size="13" font-weight="900" fill="#ff6433" text-anchor="middle">CITRUS FIZZ</text>
      
      <circle cx="55" cy="100" r="14" fill="#fed7aa"/>
      <path d="M55,90 L58,97 L65,97 L60,102 L62,109 L55,105 L48,109 L50,102 L45,97 L52,97 Z" fill="#ff6433"/>
      
      <text x="55" y="128" font-family="'Inter', sans-serif" font-size="7" fill="#78350f" text-anchor="middle">100% PURE CANE SUGAR</text>
      <text x="55" y="140" font-family="'Inter', sans-serif" font-size="6.5" font-weight="bold" fill="#16100d" text-anchor="middle">SMALL BATCH • 330 ML</text>
      <text x="55" y="152" font-family="'Inter', sans-serif" font-size="6" fill="#b45309" text-anchor="middle">ESTD. 2018</text>
    </g>
  </g>

  <!-- Botanical Citrus Accent Embellishment -->
  <g transform="translate(480, 560)">
    <circle cx="0" cy="0" r="50" fill="#ea580c" opacity="0.85"/>
    <circle cx="0" cy="0" r="42" fill="#fed7aa"/>
    <!-- Orange Slices -->
    <path d="M0,0 L-30,-20 A36,36 0 0,1 30,-20 Z" fill="#f97316"/>
    <path d="M0,0 L30,-20 A36,36 0 0,1 35,20 Z" fill="#ea580c"/>
    <path d="M0,0 L35,20 A36,36 0 0,1 -10,35 Z" fill="#f97316"/>
    <path d="M0,0 L-10,35 A36,36 0 0,1 -35,10 Z" fill="#ea580c"/>
    <path d="M0,0 L-35,10 A36,36 0 0,1 -30,-20 Z" fill="#f97316"/>
    <circle cx="0" cy="0" r="8" fill="#fff"/>
  </g>
</svg>